name: Windows build and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*-zh.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Windows x64
        run: msbuild ShaderGlass.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ShaderGlass-zh-win-x64
          path: x64/Release/ShaderGlass.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-zh.')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ShaderGlass-zh-win-x64
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s release/ShaderGlass.exe
          cd release
          sha256sum ShaderGlass.exe > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ShaderGlass.exe SHA256SUMS.txt \
            --verify-tag --latest --title "ShaderGlass 简体中文版 $RELEASE_TAG" \
            --notes-file - <<'NOTES'
          Windows x64 独立可执行文件，基于 ShaderGlass 1.3.2。

          - 汉化着色器参数窗口和内置参数标签，保留参数标识符及配置兼容性。
          - 桌面输入和像素大小菜单统一使用 Unicode 显示。
          - 包含 SHA-256 校验文件。
          NOTES

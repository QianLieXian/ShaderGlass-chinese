name: Windows build and release

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*-zh.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Windows x64
        run: |
          msbuild ShaderGlass.sln /m /p:Configuration=Release /p:Platform=x64 /fl "/flp:logfile=build-errors.log;errorsonly"
          $result = $LASTEXITCODE
          if ($result -ne 0 -and (Test-Path build-errors.log)) {
            Select-String -Path build-errors.log -Pattern 'error [A-Z0-9]+:' | Select-Object -First 12 | ForEach-Object {
              Write-Output "::error::$($_.Line.Replace('%', '%25'))"
            }
          }
          exit $result

      - name: Verify Chinese UI
        timeout-minutes: 2
        run: |
          python -X utf8 .github/scripts/check-chinese-ui.py x64/Release/ShaderGlass.exe 2>&1 | Tee-Object ui-check.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            Get-Content ui-check.log | Select-Object -Last 8 | ForEach-Object {
              Write-Output "::error::$($_.Replace('%', '%25'))"
            }
          }
          exit $result

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ShaderGlass-zh-win-x64
          path: x64/Release/ShaderGlass.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-zh.')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ShaderGlass-zh-win-x64
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s release/ShaderGlass.exe
          cd release
          sha256sum ShaderGlass.exe > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ShaderGlass.exe SHA256SUMS.txt \
            --verify-tag --latest --title "ShaderGlass 简体中文版 $RELEASE_TAG" \
            --notes-file - <<'NOTES'
          Windows x64 独立可执行文件，基于 ShaderGlass 1.3.2。

          - 补齐着色器库搜索、收藏、分类、快捷键、文件对话框等界面的中文。
          - 扩充内置参数译词，保留参数标识符及配置兼容性。
          - 桌面输入和像素大小菜单统一使用 Unicode 显示。
          - 包含 SHA-256 校验文件。
          NOTES
